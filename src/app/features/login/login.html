@for (item of formulario; track $index) {
  <p>
    <b>{{ item.label }}</b>
  </p>
  <ra-input
    [id]="$index"
    [(type)]="item.type"
    [placeHolder]="item.placeholder"
    [(value)]="item.valor"
  />
}
